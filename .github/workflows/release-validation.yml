name: Release validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql://root:synthetic-ci-password@127.0.0.1:3306/mysql
      AUTH_SECRET: synthetic-ci-auth-secret-not-for-deployment-2026
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:routes
      - name: Fresh migrations, populated upgrade and database integration tests
        run: node --import tsx scripts/verify-p3-database.ts
      - name: Build against isolated migrated database
        shell: bash
        run: |
          test_db=$(node -e "process.stdout.write(require('./tmp/p3-validation/report.json').testDatabases.chain)")
          export DATABASE_URL="mysql://root:synthetic-ci-password@127.0.0.1:3306/$test_db"
          npm run build
      - name: Retain sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-mysql-validation
          path: |
            tmp/p3-validation/report.json
            tmp/p3-validation/*.log
          retention-days: 14

# Validation only. No production credentials, migrations against production,
# automatic deployment, or automatic approval of business UAT.
